[versions]
# Align with morphe-patches-template (Compatibility / Manager display names). Hold the patcher
# at the version the oldest supported Morphe Manager bundles: a newer pin trips the manager's
# Patcher-Version gate and it refuses the bundle. Manager 2.5.0 (stable 2026-11-06) bundles 2.3.0,
# and so does desktop 2.1.1, which the fixture gates run; Manager 2.4.0 bundles 2.2.0 and refuses
# a 2.3.0 bundle. 2.3.0 keeps 2.2.0's smali and apksig (9.1.1), moves ARSCLib to 675bed2de3 for
# XML edits without decoding, reports progress, and adds patch() with global functions while
# deprecating the patch types and contexts this repo still uses. 2.2.0 added PKCS12 keystores, a
# one-pass APK write and a start callback on Patcher.invoke. 2.1.0 reads
# bundle signatures and refuses Java classes newer than 17. The 2.0
# line matches a fingerprint string against the whole literal, decodes only the resources a patch
# asks for, and hides compatiblePackages behind compatibility (PatchListGenerator rebuilds the old
# field). Manager 1.x refuses a 2.0 bundle with its update prompt.
morphe-patcher = "2.3.0"
# First stable Manager release that bundled the patcher above. The release fact check holds the
# README's stated floor to this value.
manager-floor = "2.5.0"
# Read by the app.morphe.patches settings plugin, not by anything in this repo: remove it and
# configuration fails with "Version with alias smali not found in version catalog". The commit
# resolves as com.github.MorpheApp.smali through JitPack. It is not waiting on an official
# release, which google/smali 3.0.10 delivered on 2026-08-20. Keep it the commit the patcher
# above requests (2.3.0, 2.2.0, 2.1.0 and 2.0.1 ask for ac700e1942, 2.0.0 for 4220ae75f7; 1.14.1 to 1.15.1 asked for d856bad65f). Gradle merges
# the two requests into one module and keeps the version that sorts higher, not the newer commit:
# the old pin d92701d947, one commit behind d856bad65f, sorted higher and silently replaced the
# patcher's dexlib2 in every compile, test and R8 graph. Another group's smali would instead put
# two copies of dexlib2 on the R8 classpath, and buildAndroid fails with "Classpath type already
# present".
#noinspection GradleDependency
smali = "ac700e1942"
# The Android Gradle plugin and Kotlin come from the app.morphe.patches settings plugin
# (2.1.0 brings AGP 9.1.0 and the Kotlin Gradle plugin 2.4.21); nothing here pins them.
annotation = "1.11.0"
gson = "2.14.0"
# Compile-only for the extension: see extensions/facebook/build.gradle.kts. The settings
# plugin brings the Kotlin Gradle plugin 2.4.21, so this matches it.
kotlin-stdlib = "2.4.21"
# Every com.google.guava:guava request in :patches and :extensions:facebook is rewritten to this
# (GHSA-xxph-c9ww-hj94 covers everything before 33.7.2).
guava = "33.7.2-jre"
# Every org.bouncycastle request in this build is rewritten to this, in :extensions:facebook's
# test graph and in :patches' build graph. It has to be a version that publishes all three
# modules: 1.85.2 is a bcprov-only patch release, so forcing bcpkix and bcutil to it resolved
# nothing and the dependency report said FAILED while the build still succeeded. 1.86
# (2026-09-11) publishes bcprov, bcpkix and bcutil, and sits outside seven advisories on
# versions below 1.85: CVE-2025-8916 (1.44 to 1.78), CVE-2026-5588 (1.67 to 1.83),
# CVE-2025-14813, CVE-2026-0636 and CVE-2026-5598 (GHSA-p93r-85wp-75v3, high, 1.71 to 1.83,
# with 1.80.2 and 1.81.1 fixed early; all three fixed in 1.84), CVE-2026-8763 and CVE-2026-13506
# (both fixed in 1.85). It is also outside the five fixed in 1.78: CVE-2025-8885, CVE-2024-30171,
# CVE-2024-30172, CVE-2024-29857 and CVE-2024-34447. The patcher's own 1.77 is inside all twelve;
# the 1.79 that AGP's apkzlib, builder and sdk-common ask for on the settings classpath is outside
# CVE-2025-8916 and the 1.78 five but inside the other six.
bouncycastle = "1.86"
# Host-only codec-test process ownership. Core JNA bundles native dispatch; no Android payload uses it.
jna = "5.19.1"

[libraries]
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

[plugins]
android-library = { id = "com.android.library" }
