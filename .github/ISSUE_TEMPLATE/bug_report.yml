name: 🐞 Bug report
description: Something in Hushfacebook doesn't work the way it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # Hushfacebook bug report

        Thanks for taking the time to report this. Before you start:

        - **Check whether it's already reported.** Search the [open and closed bug reports](https://github.com/SysAdminDoc/Hushfacebook/issues?q=is%3Aissue%20label%3Abug). If yours was closed and it still happens, comment on it and we'll reopen it. GitHub doesn't let the person who reported something reopen it.
        - **Not sure it's a bug?** Ask in [Discussions](https://github.com/SysAdminDoc/Hushfacebook/discussions) instead.
        - **Patching stopped with an error?** Include the full error and its Source lines. Check the [patch-selection guide](https://github.com/SysAdminDoc/Hushfacebook#patching-stops-on-one-patch) if you use more than one Facebook patch source.
  - type: input
    id: versions
    attributes:
      label: Hushfacebook and Facebook versions
      description: Long-press Facebook's icon and tap Hushfacebook. Copy the version below its status. If you have the new category pages, open More settings, then About, and copy the Version line.
      placeholder: Version 0.10.0 for Facebook 582.0.0.50.54
    validations:
      required: true
  - type: input
    id: variant
    attributes:
      label: Which Facebook file did you patch?
      description: The APKMirror variant, and whether the file you gave the patcher was an .apkm bundle or a single .apk, if you know them. Most bugs on a build that should work come from a different variant.
      placeholder: arm64-v8a, Android 11+, 240-640dpi (.apkm)
  - type: dropdown
    id: manager
    attributes:
      label: What did you patch Facebook with?
      options:
        - Morphe Manager (the Android app)
        - morphe-desktop (on a computer)
        - Something else
    validations:
      required: true
  - type: input
    id: manager_version
    attributes:
      label: Its version
      description: Morphe Manager shows its version in its own settings. If you picked "Something else", name the program too.
      placeholder: Morphe Manager 1.34.0
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: How was it installed?
      options:
        - Standard install (re-signed)
        - Root Mount
        - I don't know
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      description: Both are in your phone's Settings, under About phone. If this Facebook is a clone, say which kind too, such as one renamed by Morphe's Clone app patch, Dual Apps, Second space or a work profile.
      placeholder: Samsung Galaxy S25, Android 16
    validations:
      required: true
  - type: textarea
    id: patch_sources
    attributes:
      label: Patch sources and versions
      description: |
        Copy every Source: line from the patching log, including each source's version. If you don't have the log, open Sources in Morphe Manager and list the names and versions you used. For a local bundle, include its file name too.
      placeholder: |
        Source: Hushfacebook (version shown in Manager)
        Source: Morphe Patches (version shown in Manager)
    validations:
      required: true
  - type: textarea
    id: selected_patches
    attributes:
      label: Which patches did you select?
      description: List the selection for each source. If you kept a source's recommended selection, name that source and say so. Include any other Facebook source, even if none of its patches are selected.
      placeholder: |
        Hushfacebook: recommended selection, plus Download any video
        Morphe Patches: Disable Play Store updates
        De-ReVanced: none selected
    validations:
      required: true
  - type: dropdown
    id: affected_surface
    attributes:
      label: Where did it happen?
      options:
        - News feed
        - Stories
        - Reels or Watch
        - Links and the in-app browser
        - Downloads
        - Profiles or Settings pages
        - Dark mode
        - Hushfacebook settings
        - Patching (Morphe Manager)
        - Other
    validations:
      required: true
  - type: textarea
    id: bug_description
    attributes:
      label: What went wrong?
      description: What happened, and what did you expect to happen instead? A screenshot or a screen recording helps a lot. Cover names and private messages first.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What did you tap, in order?
      description: Start from opening Facebook. Include every Hushfacebook switch you changed before it went wrong, and say whether it still happens after you close Facebook and open it again. For a reel, story or video, say where you opened it, such as the Reels tab, a reel in the news feed, a profile, Watch or a shared link.
      placeholder: |
        1. Opened Facebook
        2. Scrolled the news feed
        3. A sponsored post showed after about twenty posts
    validations:
      required: true
  - type: textarea
    id: diagnostic_report
    attributes:
      label: Diagnostic report
      description: |
        This answers most of our questions, so please add it if you can. It works with Debug logging off and then still names your build, the patches in it and what each one has counted. For the most detail, long-press Facebook's icon, tap Hushfacebook, turn on Debug logging, do the thing that goes wrong, then come back, tap Export diagnostic report and pick Save full report. If you have the new category pages, these controls are under More settings, then Pause, backup and diagnostics. That saves a text file in Download/Morphe on your phone. Drag it into this box. If you can't get the file off your phone, pick Copy quick report instead and paste the shorter report here.
        The report leaves out links, Facebook addresses, long ID numbers, cookies, sign-in tokens and Authorization headers, JSON included. It can't spot a name or message written anywhere else, so read it and remove anything private before you post it.
  - type: textarea
    id: additional_context
    attributes:
      label: Anything else?
      description: A workaround you found, an older version where it still worked, or anything else that might help.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you send it
      options:
        - label: I searched the open and closed bug reports and this isn't one of them.
          required: true
        - label: I answered every question above as well as I could.
          required: true
